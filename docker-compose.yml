version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kinerjapenelitiandosen:latest
    container_name: kinerjadosen_app
    restart: always
    ports:
      - "8086:80"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8086
      - DB_CONNECTION=mysql
      - DB_HOST=kinerjadosen_db
      - DB_PORT=3306
      - DB_DATABASE=kinerja_dosen
      - DB_USERNAME=root
      - DB_PASSWORD=dbpassword_secret
    depends_on:
      - db
    networks:
      - app_network

  db:
    image: mariadb:10.11
    container_name: kinerjadosen_db
    restart: always
    environment:
      - MYSQL_DATABASE=kinerja_dosen
      - MYSQL_ROOT_PASSWORD=dbpassword_secret
    ports:
      - "33066:3306"
    volumes:
      - db_data_v2:/var/lib/mysql
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  db_data_v2:
